[pytest]
# Capture sys.stdout/sys.stderr only, not file descriptors 1/2. Fd-level capture
# (pytest's default) swaps those fds with dup2 around every test phase; on
# Windows that closes handles Tcl cached for its standard channels, and a later
# tkinter.Tk() intermittently fails with 'invalid command name "tcl_findLibrary"'
# (https://github.com/jamesabel/balsa/pull/27; see CHANGELOG, Unreleased).
# No test uses capfd. On the Windows CI runner 1 of 1000 Tk roots failed with fd
# capture and 0 of 1000 with sys capture (CHANGELOG, Unreleased).
addopts = --capture=sys
