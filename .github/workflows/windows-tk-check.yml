name: Windows Tk check

# Manual, bounded check of the intermittent Windows Tk start-up failure
# ('invalid command name "tcl_findLibrary"', see pytest.ini):
#   1. evidence: N Tk roots under pytest's fd capture vs. sys capture;
#   2. verification: the full suite and tests/test_dataset_tabs_gui.py on its
#      own, each repeated, with the repository's pytest settings. Every repeat
#      must pass with no skipped test.
on:
  workflow_dispatch:
    inputs:
      stress_roots:
        description: "Tk roots per capture mode (at most 2000)"
        required: true
        default: "1000"
      full_runs:
        description: "Full test suite repeats (at most 5)"
        required: true
        default: "3"
      dataset_runs:
        description: "test_dataset_tabs_gui.py repeats (at most 20)"
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  tk-check:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      TREN_REQUIRE_TK: "1"
      TREN_TK_STRESS_ROOTS: ${{ inputs.stress_roots }}
      FULL_RUNS: ${{ inputs.full_runs }}
      DATASET_RUNS: ${{ inputs.dataset_runs }}
    steps:
      - name: Check bounds
        run: |
          if ([int]$env:TREN_TK_STRESS_ROOTS -gt 2000 -or [int]$env:FULL_RUNS -gt 5 -or [int]$env:DATASET_RUNS -gt 20) {
            throw "inputs above their limits (2000 / 5 / 20)"
          }

      - uses: actions/checkout@v4

      # Same Python/Tcl/Tk and installer as the Windows CI job and package workflow.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Install dependencies
        run: ./packaging/install_windows_deps.ps1 -Dev -ExpectPython 3.11.9 -ExpectTclTk 8.6.12

      # Evidence only, expected to fail sometimes: pytest's fd-level capture.
      - name: Tk roots under --capture=fd
        continue-on-error: true
        run: |
          python -m pytest tests/tk_capture_stress.py --capture=fd -q --junitxml=reports/stress-fd.xml
          $code = $LASTEXITCODE
          [xml]$x = Get-Content reports/stress-fd.xml
          $x.SelectNodes('//testcase/failure') | Group-Object { $_.GetAttribute('message') } |
            ForEach-Object { Write-Host "[$($_.Count)x] $($_.Name)" }
          exit $code

      # The capture mode pytest.ini sets: must not fail.
      - name: Tk roots under --capture=sys
        if: ${{ !cancelled() }}
        run: |
          python -m pytest tests/tk_capture_stress.py --capture=sys -q --junitxml=reports/stress-sys.xml
          $code = $LASTEXITCODE
          [xml]$x = Get-Content reports/stress-sys.xml
          $x.SelectNodes('//testcase/failure') | Group-Object { $_.GetAttribute('message') } |
            ForEach-Object { Write-Host "[$($_.Count)x] $($_.Name)" }
          exit $code

      - name: Repeat the full suite and test_dataset_tabs_gui.py
        if: ${{ !cancelled() }}
        run: |
          $results = [System.Collections.Generic.List[object]]::new()
          function Invoke-Repeat([string]$Label, [int]$Count, [string[]]$TestPaths) {
            for ($i = 1; $i -le $Count; $i++) {
              $xml = "reports/$Label-$i.xml"
              python -m pytest -q -rs "--junitxml=$xml" @TestPaths
              $code = $LASTEXITCODE
              $row = [ordered]@{ run = "$Label #$i"; exit = $code; tests = 0; failures = 0; errors = 0; skipped = 0 }
              if (Test-Path $xml) {
                [xml]$x = Get-Content $xml
                foreach ($s in $x.SelectNodes('//testsuite')) {
                  foreach ($k in 'tests', 'failures', 'errors', 'skipped') { $row[$k] += [int]$s.GetAttribute($k) }
                }
              }
              $results.Add([pscustomobject]$row)
            }
          }
          Invoke-Repeat "full" ([int]$env:FULL_RUNS) @()
          Invoke-Repeat "dataset" ([int]$env:DATASET_RUNS) @("tests/test_dataset_tabs_gui.py", "tests/test_tk_startup.py")
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $bad = @($results | Where-Object { $_.exit -ne 0 -or $_.skipped -gt 0 -or $_.tests -eq 0 })
          if ($bad.Count -gt 0) { throw "$($bad.Count) of $($results.Count) runs failed or skipped tests" }
          Write-Host "All $($results.Count) runs passed with no skipped test."

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-tk-check-reports
          path: reports
          if-no-files-found: warn
