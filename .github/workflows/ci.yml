name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile src/tren/annotation_model.py src/tren/cs_pipeline.py src/tren/cs_annotator_app.py

      - name: Run quickstart
        run: python examples/quickstart.py

      # GUI tests (tests/test_*_gui.py and parts of test_confidence_integration.py)
      # skip themselves when Tk cannot open a display; run them under a virtual
      # X server, and fail here rather than silently skipping them if Tk is unusable.
      - name: Install virtual display for GUI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check Tk can open a display
        run: xvfb-run -a python -c "import tkinter; tkinter.Tk().destroy()"

      - name: Run tests
        run: xvfb-run -a python -m pytest -rs

      # As users install it (pip install .): the resources must come with the package.
      - name: Check the installed package
        run: |
          pip install --no-deps .
          cd "$RUNNER_TEMP"
          python -c "import os, tren, tren.reranking as r; d = os.path.join(os.path.dirname(tren.__file__), 'resources'); missing = [f for f in ('lid.176.ftz', 'frequent_tr_words.txt', 'frequent_en_words.txt') if not os.path.isfile(os.path.join(d, f))]; assert not missing, missing; assert r.load_reranker_bundle() is not None, r.last_load_failure; print('installed tren OK:', d)"

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Pinned, and checked by the installer, to the Python/Tcl/Tk the Windows
      # package is built with (.github/workflows/windows-package.yml).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      # Same installer as the Windows package workflow: builds fasttext 0.9.3
      # for MSVC, stops at the first failure, and ends with a real model check.
      - name: Install dependencies
        run: ./packaging/install_windows_deps.ps1 -Dev -ExpectPython 3.11.9 -ExpectTclTk 8.6.12

      - name: Syntax check
        run: python -m py_compile src/tren/annotation_model.py src/tren/cs_pipeline.py src/tren/cs_annotator_app.py

      - name: Run quickstart
        run: python examples/quickstart.py

      # Fail here rather than silently skipping the GUI tests if Tk is unusable.
      - name: Check Tk can open a window
        run: python -c "import sys, tkinter; r = tkinter.Tk(); print(sys.version, 'Tcl/Tk', r.tk.call('info', 'patchlevel')); r.destroy()"

      # TREN_REQUIRE_TK: a Tk start-up failure fails the run with its traceback
      # instead of skipping GUI tests (tests/tk_probe.py).
      - name: Run tests
        env:
          TREN_REQUIRE_TK: "1"
        run: python -m pytest -rs --junitxml=pytest-windows.xml

      # The dataset GUI tests on their own as well: in a separate process they
      # have failed with an intermittent Tk start-up error (see pyproject.toml).
      - name: Run test_dataset_tabs_gui.py on its own
        if: ${{ !cancelled() }}
        env:
          TREN_REQUIRE_TK: "1"
        run: python -m pytest -rs tests/test_dataset_tabs_gui.py tests/test_tk_startup.py

      # Skipped tests are not passes: fail the job if any test was skipped.
      - name: Fail on skipped tests
        if: ${{ !cancelled() }}
        run: |
          [xml]$x = Get-Content pytest-windows.xml
          $skipped = 0
          foreach ($s in $x.SelectNodes('//testsuite')) { $skipped += [int]$s.skipped }
          Write-Host "skipped tests: $skipped"
          $x.SelectNodes('//testcase/skipped') | Group-Object { $_.GetAttribute('message') } |
            ForEach-Object { Write-Host "[$($_.Count)] $($_.Name)" }
          if ($skipped -gt 0) { exit 1 }

      # As users install it (pip install --no-deps . after install_windows_deps.ps1).
      - name: Check the installed package
        run: |
          pip install --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          python -c "import os, tren, tren.reranking as r; d = os.path.join(os.path.dirname(tren.__file__), 'resources'); missing = [f for f in ('lid.176.ftz', 'frequent_tr_words.txt', 'frequent_en_words.txt') if not os.path.isfile(os.path.join(d, f))]; assert not missing, missing; assert r.load_reranker_bundle() is not None, r.last_load_failure; print('installed tren OK:', d)"
