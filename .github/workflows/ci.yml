name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile annotation_model.py cs_pipeline.py cs_annotator_app.py

      - name: Run quickstart
        run: python examples/quickstart.py

      # GUI tests (tests/test_*_gui.py and parts of test_confidence_integration.py)
      # skip themselves when Tk cannot open a display; run them under a virtual
      # X server, and fail here rather than silently skipping them if Tk is unusable.
      - name: Install virtual display for GUI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check Tk can open a display
        run: xvfb-run -a python -c "import tkinter; tkinter.Tk().destroy()"

      - name: Run tests
        run: xvfb-run -a python -m pytest -rs

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Same installer as the Windows package workflow: builds fasttext 0.9.3
      # for MSVC, stops at the first failure, and ends with a real model check.
      - name: Install dependencies
        run: ./packaging/install_windows_deps.ps1 -Dev

      - name: Syntax check
        run: python -m py_compile annotation_model.py cs_pipeline.py cs_annotator_app.py

      - name: Run quickstart
        run: python examples/quickstart.py

      # Fail here rather than silently skipping the GUI tests if Tk is unusable.
      - name: Check Tk can open a window
        run: python -c "import sys, tkinter; r = tkinter.Tk(); print(sys.version, 'Tcl/Tk', r.tk.call('info', 'patchlevel')); r.destroy()"

      # Diagnostic only: back-to-back Tk create/destroy outside pytest, the way
      # each GUI test module probes Tk during collection (tests/tk_probe.py).
      - name: Tk create/destroy cycles (diagnostic)
        continue-on-error: true
        run: python tests/tk_probe.py --repeat 20

      # TREN_REQUIRE_TK: a Tk start-up failure fails the run with its traceback
      # instead of skipping GUI tests; TREN_TK_DIAGNOSTICS: list every probe.
      - name: Run tests
        env:
          TREN_REQUIRE_TK: "1"
          TREN_TK_DIAGNOSTICS: "1"
        run: python -m pytest -rs --junitxml=pytest-windows.xml

      # Comparison for the module whose GUI tests were skipped in the full run.
      - name: Run test_dataset_tabs_gui.py on its own
        if: ${{ !cancelled() }}
        env:
          TREN_REQUIRE_TK: "1"
          TREN_TK_DIAGNOSTICS: "1"
        run: python -m pytest -rs tests/test_dataset_tabs_gui.py tests/test_tk_startup.py

      # Skipped tests are not passes: fail the job if any test was skipped.
      - name: Fail on skipped tests
        if: ${{ !cancelled() }}
        run: |
          [xml]$x = Get-Content pytest-windows.xml
          $skipped = 0
          foreach ($s in $x.SelectNodes('//testsuite')) { $skipped += [int]$s.skipped }
          Write-Host "skipped tests: $skipped"
          $x.SelectNodes('//testcase/skipped') | Group-Object { $_.GetAttribute('message') } |
            ForEach-Object { Write-Host "[$($_.Count)] $($_.Name)" }
          if ($skipped -gt 0) { exit 1 }
